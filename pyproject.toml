[project]
name = "ecc-cbc-crypto"
version = "0.1.0"
description = "Crypto ECC + ECDH + CBC en Python pur"
readme = "README.md"
authors = [
    { name = "jobiyax", email = "contact@jobiyax.blog" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "questionary>=2.1.1",
]

[project.scripts]
ecc-cbc-crypto = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
