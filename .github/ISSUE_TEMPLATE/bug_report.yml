name: "Bug Report"
description: "Signaler un bug ou un comportement inattendu"
title: "[BUG] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Merci de signaler ce bug. Remplissez les champs ci-dessous.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Une description claire du bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Les étapes précises pour reproduire le problème.
      placeholder: |
        1. Lancer '...'
        2. Saisir '...'
        3. Observer l'erreur
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Ce que vous attendiez.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
      description: Ce qui s'est réellement passé.
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Version Python
      description: "Ex: 3.14"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Système d'exploitation
      description: "Ex: Ubuntu 24.04, Windows 11"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Informations supplémentaires
      description: Tout autre contexte, capture d'écran, ou logs.
    validations:
      required: false
